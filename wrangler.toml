# Channel Z0 — Cloudflare Pages project.
# The storefront is fully static; Cloudflare serves it at ch0.ripostelabs.xyz
# (and, once purchased, channelz0.tv). The live video still comes from the
# Owncast tower on the VPS — Cloudflare only carries the page.
#
# Primary deploy path is Cloudflare's Git integration (Workers & Pages →
# Connect to Git, build output directory "site") — it auto-deploys on push and
# needs no CI file. This wrangler.toml documents the project + lets you deploy
# by hand if you want:  npx wrangler pages deploy site --project-name=channel-z0

name = "channel-z0"
compatibility_date = "2026-01-01"
pages_build_output_dir = "site"
