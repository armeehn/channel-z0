# Channel Z0 — optional: host the storefront on GitHub Pages.
#
# The storefront is fully static, so Pages can serve it for free while the
# stream itself comes from your VPS. To enable:
#   repo Settings → Pages → Source: "GitHub Actions"
# then push to main (or run this workflow manually).
#
# Remember to set the CONFIG block in site/index.html to your real domains
# first — and note Owncast must be reachable over HTTPS for the player/status
# calls to work from a Pages origin.
name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
