# Channel Z0 — deploy the storefront to Cloudflare Pages.
#
# This is the primary host for the site (ch0.ripostelabs.xyz for now, and
# channelz0.tv once purchased). Cloudflare serves the static page; the live
# stream still comes from the Owncast tower on the VPS.
#
# One-time setup:
#   1. Cloudflare dashboard → Workers & Pages → create a Pages project named
#      "channel-z0" (Direct Upload). Add the custom domain ch0.ripostelabs.xyz
#      under the project's Custom domains tab; since ripostelabs.xyz is on
#      Cloudflare DNS the record is created for you instantly.
#   2. Create an API token (My Profile → API Tokens) with the
#      "Cloudflare Pages: Edit" permission.
#   3. In this repo: Settings → Secrets and variables → Actions, add
#      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# After that, every push that touches site/ redeploys automatically.
name: Deploy storefront to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.toml", ".github/workflows/deploy-cloudflare.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=channel-z0
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
