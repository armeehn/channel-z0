<!doctype html>
<meta charset="utf-8">
<title>GROUND ZERO — COMING SOON</title>
<style>
  /* Channel Z0 — GROUND ZERO show card.
     New programme branding. GROUND ZERO is the station's nightly slot, so it
     gets its own identity rather than wearing the Riposte spec sheet: an ink
     field, a reticle mark (the epicentre — the point where it happened), and
     marigold as the single signal accent.

     What is deliberately kept from the Riposte system, so it still reads as
     the same station: JetBrains Mono only, hard edges, no blur, no gradients
     except the station tri-band, 2px rules, corner marks, spec-sheet chrome.
     The one departure is the reticle's curves — brand rule 3 allows curves for
     a logo, and this is the programme's mark. */
  :root{
    --ink:#1d1a17; --ink-raised:#241f1b; --ink-line:#5c554c;
    --bone:#f6f1e7; --orange:#fe9a0d;
    --pink:#f0477d; --teal:#12b795;
  }
  *{margin:0;padding:0;box-sizing:border-box;border-radius:0}
  html,body{width:640px;height:480px;overflow:hidden}
  body{
    background:var(--ink); color:var(--bone);
    font-family:"JetBrains Mono",monospace; font-weight:400;
    -webkit-font-smoothing:antialiased; position:relative;
  }

  /* ── the mark: a reticle bleeding off the right edge ─────────────── */
  .reticle{position:absolute;top:240px;left:566px;width:0;height:0}
  .reticle i{position:absolute;border:2px solid var(--ink-line);
    border-radius:50%;transform:translate(-50%,-50%);display:block}
  .r1{width:404px;height:404px}
  .r2{width:300px;height:300px}
  .r3{width:196px;height:196px}
  .r4{width:92px;height:92px;border-color:var(--orange)!important}
  /* The centre dot rides the same `.reticle i` machinery as the rings rather
     than positioning itself — as a bare span it resolved to a ~6px width and
     rendered as a capsule instead of a circle. */
  .reticle i.dot{width:18px;height:18px;background:var(--orange);
    border-color:var(--orange)}
  /* crosshair arms */
  .cross{position:absolute;background:var(--ink-line)}
  .cx{left:-232px;top:-1px;width:464px;height:2px}
  .cy{left:-1px;top:-232px;width:2px;height:464px}

  /* ── content ─────────────────────────────────────────────────────── */
  .triband{height:8px;
    background:linear-gradient(105deg,var(--pink) 0 36%,var(--orange) 36% 64%,var(--teal) 64% 100%)}

  .corner{position:absolute;width:14px;height:14px;border:2px solid var(--bone);opacity:.55}
  .corner.tl{top:20px;left:18px;border-right:0;border-bottom:0}
  .corner.bl{bottom:112px;left:18px;border-right:0;border-top:0}

  .frame{position:absolute;top:0;left:0;padding:18px 0 0 40px;width:420px}

  .kickerrow{display:flex;align-items:center;gap:10px;
    border-bottom:2px solid var(--bone);padding-bottom:8px}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
  .kicker .slash{color:var(--orange)}

  .desig{margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.34em;
    text-transform:uppercase;color:var(--ink-line)}
  h1{margin-top:8px;font-size:52px;font-weight:800;letter-spacing:.005em;
    line-height:.9;text-transform:uppercase}
  h1 .zero{color:var(--orange)}
  .rule{height:2px;background:var(--bone);margin-top:10px;width:340px}

  /* marigold is the only accent that takes ink text — 8.12:1, the best pairing */
  .status{margin-top:12px;display:inline-block;background:var(--orange);color:var(--ink);
    font-size:21px;font-weight:800;letter-spacing:.14em;padding:7px 14px;
    text-transform:uppercase}

  .blurb{margin-top:11px;font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--bone);opacity:.72;line-height:1.65}

  /* spec rows, dark-field variant — dashed dividers in ink-line, never text */
  .spec{margin-top:11px;width:360px}
  .row{display:flex;justify-content:space-between;font-size:11px;
    padding:3px 0;border-bottom:1px dashed var(--ink-line)}
  .row .k{font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--bone);opacity:.6}
  .row .v{font-weight:700;letter-spacing:.04em;color:var(--bone)}

  /* ── datum strip ─────────────────────────────────────────────────── */
  .foot{position:absolute;left:0;right:0;bottom:105px}
  .datum{display:flex;justify-content:space-between;gap:20px;
    background:var(--ink-raised);
    border-top:2px solid var(--bone);padding:6px 40px;
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    white-space:nowrap}
  .datum span{color:var(--bone);opacity:.8}
  .datum span b{color:var(--orange);font-weight:700}
</style>

<div class="triband"></div>
<span class="corner tl"></span><span class="corner bl"></span>

<div class="reticle">
  <span class="cross cx"></span><span class="cross cy"></span>
  <i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i>
  <i class="dot"></i>
</div>

<div class="frame">
  <div class="kickerrow">
    <div class="kicker">Channel Z0 <span class="slash">//</span> Nightly</div>
  </div>

  <div class="desig">Desig. RL-Z0-GND &nbsp;·&nbsp; Epicentre</div>
  <h1>Ground<br>Zer<span class="zero">o</span></h1>
  <div class="rule"></div>

  <div class="status">Coming Soon</div>

  <div class="blurb">
    The day, from the point it happened.
  </div>

  <div class="spec">
    <div class="row"><span class="k">Transmission</span><span class="v">Nightly 19:00</span></div>
    <div class="row"><span class="k">Encore</span><span class="v">22:00</span></div>
    <div class="row"><span class="k">Status</span><span class="v">▸ Standby</span></div>
  </div>
</div>

<div class="foot">
  <div class="datum">
    <span>Doc No. <b>RL-Z0-GND-A</b></span>
    <span>49.8831&deg;N &nbsp;119.4857&deg;W</span>
    <span>Rev. A</span>
  </div>
</div>
