# Channel Z0 — the channel bug. The little mark that sits in the corner
# forever, so a viewer landing mid-programme knows whose signal this is.
#
# The art is generated by tools/make-bug.sh, which draws it solid white on
# transparent and leaves the dimming to whoever composites it — that's this
# file's opacity_percent, not anything baked into the PNG.
name: "Z0 BUG"

image: "/media/branding/z0-bug.png"

opacity_percent: 72

location: "BottomRight"
horizontal_margin_percent: 4

# 8%, not the usual 5%. The crawl runs along the bottom of the frame at
# y=1012, and a bug at 5% margin has its baseline at y=1026 — inside the
# crawl's strip. Nothing warns about two elements sharing pixels; they just
# overlap on air. Raising the bug clears it with room to spare.
vertical_margin_percent: 8

scale: true
scale_width_percent: 9

z_index: 10
