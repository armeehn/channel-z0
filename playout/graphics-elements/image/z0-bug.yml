# Channel Z0 — the channel bug. The little mark that sits in the same place
# forever, so a viewer landing mid-programme knows whose signal this is.
#
# The art is generated by tools/make-bug.sh at exactly 107x140 and composited
# 1:1 into the bottom of the right rail, directly beneath the conditions block
# (340 + 140 = 480). It carries the same red spine down its inner edge, which
# is what continues the rule the block above it starts.
#
# ── Why this is its own element and not part of the weather rail ────────────
#
# It would be one fewer element to composite if the bug were drawn into
# z0-weather-card.png. It is kept separate on purpose: that PNG is rewritten
# by a cron job every 15 minutes and the bug must never depend on a cron job
# or on the forecast API being reachable. make-bug.sh runs once, by hand, and
# the result never changes.
#
# It is also fully opaque now, where it used to be dimmed to 72%. That dimming
# existed solely to let the programme show through it. In the rail there is
# nothing behind it, so the dimming bought nothing and cost legibility.
name: "Z0 BUG"

image: "/media/branding/z0-rail-bug.png"

opacity_percent: 100

location: "BottomRight"
horizontal_margin_percent: 0
vertical_margin_percent: 0

# Authored at final size. See the note in z0-rail-left.yml.
scale: false

z_index: 10
