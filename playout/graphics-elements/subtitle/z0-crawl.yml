# Channel Z0 — the crawl along the bottom of the frame.
#
# The track is regenerated every 15 minutes by tools/z0-weather.sh and carries
# the current conditions plus the next few programmes off ErsatzTV's own guide.
#
# It is a subtitle element because that is the only overlay type here with its
# own timeline — libass gives the \move that scrolls the text. The cost of that
# is that the timeline is relative to the START OF THE PROGRAMME, not the wall
# clock: every item restarts the crawl from its first pass. That reads as
# normal station behaviour, but it does mean the generator has to lay down
# enough passes to cover the longest programme (it writes six hours' worth).
name: "Z0 CRAWL"

template: "/media/branding/z0-crawl.ass"

z_index: 30
