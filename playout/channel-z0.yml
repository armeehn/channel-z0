# ─────────────────────────────────────────────────────────────────────────────
# CHANNEL Z0 — the broadcast week, as ErsatzTV plays it.
#
# This is the on-air twin of docs/programming.md and of the program grid in
# site/index.html. All three are meant to say the same thing; edit them
# together or the guide and the guide-on-the-wall drift apart.
#
# Wiring: Playouts -> Add, pick the Channel Z0 channel, playout type "YAML",
# and select this file. ErsatzTV stores the path, not a copy, so editing this
# file and rebuilding the playout is how you change the schedule.
#
# ── Two things to know before you edit ──────────────────────────────────────
#
# 1. THE WEEK IS A SEVEN-DAY CYCLE, NOT A CALENDAR.
#    ErsatzTV's YAML playout has no day-of-week primitive. The seven day blocks
#    below run in order and `repeat: true` sends it back to Monday. Alignment
#    with real weekdays therefore depends entirely on WHICH DAY THE PLAYOUT IS
#    FIRST BUILT OR RESET ON. Build or reset this playout on a MONDAY and the
#    themed nights match the published guide; do it on a Thursday and the whole
#    week is three days out of phase with the storefront. There is no way to
#    detect or correct this from inside the file.
#
#    Build it EARLY ON THAT MONDAY, before 06:00, for a clean first day. A
#    playout built at three in the afternoon starts at instruction one, so every
#    morning `pad_until` has already passed and collapses to nothing — the day
#    falls through to the first target still in the future and the evening gets
#    stretched to fill. It rights itself at the next sign-on, but the first day
#    on air will not look like the guide.
#
# 2. SLOTS MARKED "(STANDBY)" ARE PLACEHOLDERS.
#    GROUND ZERO, LAB HOUR and the NEIGHBOURHOOD DESK are the station's own
#    programmes and no footage exists yet — shows/Ground Zero, shows/Lab Hour
#    and commercials/ are all empty folders. Their slots are kept at the right
#    times (the shape of the day is the point) but filled from the vintage
#    shorts pool so nothing goes to black. When the real episodes land, drop
#    them in the matching folder, rescan, and change that slot's `content:` to
#    `ground_zero` / `lab_hour` — the content keys are already defined below,
#    commented out, waiting.
#
#    Do NOT point a slot at a content key that resolves to zero media items.
#    An empty enumerator has nothing to schedule and the playout build will
#    stall on it rather than skip it.
# ─────────────────────────────────────────────────────────────────────────────

content:
  # ── The acquired half: public-domain material, fetched by
  #    tools/fetch-archive.sh. Every item lives under the /media library path,
  #    and ErsatzTV tags Other Videos with their folder names — which is what
  #    these queries match on. A file in /media/movies/noir carries the tags
  #    "media", "movies" and "noir", so `tag:noir` is exact enough on its own.
  - key: cartoons
    search: Cartoons
    query: 'type:other_video AND tag:cartoons'
    order: shuffle

  - key: prelinger
    search: Prelinger Theatre
    query: 'type:other_video AND tag:prelinger'
    order: shuffle

  - key: psas
    search: PSAs and short subjects
    query: 'type:other_video AND tag:psas'
    order: shuffle

  - key: slowtv
    search: Slow television
    query: 'type:other_video AND tag:slowtv'
    order: shuffle

  # The themed feature pools. One sub-collection per night, exactly as the
  # programme bible describes, so the schedule can ask for "a noir" by name.
  - key: noir
    search: Features - Noir
    query: 'type:other_video AND tag:noir'
    order: shuffle

  - key: scifi
    search: Features - SciFi
    query: 'type:other_video AND tag:scifi'
    order: shuffle

  - key: docs
    search: Features - Docs
    query: 'type:other_video AND tag:docs'
    order: shuffle

  - key: serials
    search: Features - Serials
    query: 'type:other_video AND tag:serials'
    order: shuffle

  - key: classics
    search: Features - Classics
    query: 'type:other_video AND tag:classics'
    order: shuffle

  - key: cult
    search: Features - Cult
    query: 'type:other_video AND tag:cult'
    order: shuffle

  # ── Station identity. The idents are the connective tissue between blocks;
  #    the cards bracket the day.
  - key: bumpers
    search: Station idents
    query: 'type:other_video AND tag:bumpers'
    order: shuffle

  - key: testcard
    search: Test card
    query: 'type:other_video AND tag:interstitials AND title:testcard'
    order: chronological

  - key: signoff
    search: Sign-off card
    query: 'type:other_video AND tag:interstitials AND title:signoff'
    order: chronological

  - key: colorbars
    search: Colour bars
    query: 'type:other_video AND tag:interstitials AND title:colorbars'
    order: chronological

  # ── The originals. Uncomment once there is footage in these folders, then
  #    point the matching slots below at these keys instead of `psas`.
  # - key: ground_zero
  #   search: Ground Zero
  #   query: 'type:other_video AND tag:"Ground Zero"'
  #   order: chronological
  #
  # - key: lab_hour
  #   search: Lab Hour
  #   query: 'type:other_video AND tag:"Lab Hour"'
  #   order: chronological

playout:
  # ══ MONDAY ═════════════════════════════════════════════════════════════════
  - count: 1
    content: testcard
    custom_title: 'SIGN-ON · MORNING PATTERN'
  - pad_until: '06:30'
    content: bumpers
  - pad_until: '07:00'
    content: slowtv
    custom_title: 'STRETCH & COFFEE'
  - pad_until: '09:00'
    content: cartoons
    custom_title: 'CARTOON BLOCK'
  - pad_until: '11:00'
    content: prelinger
    custom_title: 'PRELINGER THEATRE'
  - pad_until: '12:00'
    content: psas
    custom_title: 'LAB HOUR (STANDBY)'
  - pad_until: '14:00'
    content: prelinger
    custom_title: 'LUNCH LOOPS'
  - count: 1
    content: classics
    custom_title: 'AFTERNOON PICTURE SHOW'
  - pad_until: '16:00'
    content: psas
  - pad_until: '18:00'
    content: cartoons
    custom_title: 'CARTOON BLOCK II'
  - pad_until: '19:00'
    content: psas
    custom_title: 'NEIGHBOURHOOD DESK (STANDBY)'
  - pad_until: '19:30'
    content: psas
    custom_title: 'GROUND ZERO (STANDBY)'
  - pad_until: '20:00'
    content: bumpers
  - count: 1
    content: noir
    custom_title: 'MONDAY NIGHT NOIR'
  - pad_until: '22:00'
    content: psas
  - pad_until: '22:30'
    content: psas
    custom_title: 'GROUND ZERO — ENCORE (STANDBY)'
  - pad_until: '23:00'
    content: bumpers
  - pad_until: '00:00'
    tomorrow: true
    content: prelinger
    custom_title: 'AFTER HOURS'
  - count: 1
    content: signoff
    custom_title: 'SIGN-OFF'
  # Colour bars until sunrise. This is the only block that may be cut
  # mid-item — it is a static pattern, and trimming it is what makes the next
  # sign-on land exactly on 06:00 instead of drifting later every day.
  - pad_until: '06:00'
    tomorrow: true
    trim: true
    content: colorbars
    custom_title: 'COLOUR BARS'

  # ══ TUESDAY ════════════════════════════════════════════════════════════════
